version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
platform: WEB_COMPUTE
env:
  variables:
    AMPLIFY_SKIP_FRAMEWORK_DETECTION: 'true'
